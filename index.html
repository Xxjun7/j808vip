<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <!-- 🎯 關鍵防護：加入 viewport-fit=cover 讓畫面延伸至手機邊緣（填滿安全區黑條） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>金正旺銀行vip抽卡系統</title>
    <link rel="icon" type="image/x-icon" href="./Jicon.ico">

    <!-- ========================================== -->
    <!-- CSS 樣式表設定區段                         -->
    <!-- ========================================== -->
    <style>
      /* 全局通用的基本重置與設定 */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        touch-action: manipulation;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        font-family: 'Arial Black', Impact, sans-serif;
        background-color: #080b10;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }

      /* 遊戲主容器與背景設置 (🎯 擴展至安全區域外，徹底消除左右黑條) */
      #game-container {
        position: fixed;
        top: -100px;
        left: -100px;
        right: -100px;
        bottom: -100px;
        width: auto;
        height: auto;

        background-image: url('image_6.png');
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
        /* 內部加上安全距離 padding，避免內容被手機瀏海或圓角遮擋 */
        padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        overflow: hidden;
        transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
      }

      /* 強制旋轉畫面 (直向轉橫向模擬) 設定 */
      #game-container.force-rotated {
        position: fixed !important;
        width: 100dvh !important;
        height: 100vw !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) rotate(90deg) !important;
        transform-origin: center center;
      }

      #game-container.force-rotated #card-area {
        gap: clamp(10px, 2dvh, 30px) !important;
      }

      #game-container.force-rotated .card-container {
        width: clamp(90px, 25dvh, 240px) !important;
      }

      #game-container.force-rotated .card-amount {
        font-size: clamp(14px, 2.5dvh, 24px) !important;
      }

      /* 卡片排列區域 */
      #card-area {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: clamp(10px, 2vw, 30px);
        width: 100%;
        max-width: 1000px;
      }

      /* 單張卡片外框與 3D 視距容器 */
      .card-container {
        width: clamp(90px, 25vw, 240px);
        aspect-ratio: 2.5 / 3.5;
        perspective: 1200px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* 卡片震動與懸停浮動效果容器 */
      .card-shaker {
        width: 100%;
        height: 100%;
        will-change: transform;
        transition: transform 0.3s ease;
      }

      .card-container:hover .card-shaker {
        transform: translateY(-10px) scale(1.03);
      }

      .card-shaker.shaking {
        animation: cardShake 0.4s ease-in-out infinite;
      }

      @keyframes cardShake {
        0% { transform: scale(1) rotate(0deg); }
        20% { transform: scale(1.05) rotate(-5deg) translateY(-5px); }
        40% { transform: scale(1.05) rotate(5deg) translateY(-5px); }
        60% { transform: scale(1.08) rotate(-4deg) translateY(-8px); }
        80% { transform: scale(1.08) rotate(4deg) translateY(-8px); }
        100% { transform: scale(1) rotate(0deg); }
      }

      /* 卡片主體與 3D 翻轉動態 */
      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
        transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        border-radius: clamp(8px, 1.5vw, 16px);
        will-change: transform;
      }

      .card.flipped {
        transform: rotateY(180deg);
      }

      /* 卡片正反面通用樣式 */
      .card-face {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        border-radius: clamp(8px, 1.5vw, 16px);
        overflow: hidden;
        background-size: 100% 100%;
        background-position: center;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 229, 255, 0.2);
        border: 1px solid rgba(255, 215, 0, 0.3);
        transform: translateZ(1px);
      }

      .card-back {
        background-image: url('Card_Back.JPG');
      }

      .card-front {
        background-image: url('Card_Front.JPG');
        transform: rotateY(180deg) translateZ(1px);
        position: relative;
      }

      /* 卡片正面獎項文字顯示 */
      .card-amount {
        position: absolute;
        top: 27.5%;
        left: 50%;
        transform: translateX(-50%);
        width: 70%;
        text-align: center;
        font-size: clamp(14px, 2.5vw, 24px);
        font-weight: 900;
        color: #fff6d1;
        text-shadow: 0 0 5px #ffd700, 0 0 10px #ff8c00, 0 0 20px #ff0000;
        letter-spacing: 1px;
        pointer-events: none;
      }

      /* 通用按鈕元件樣式 */
      .ui-btn {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        background: rgba(255, 215, 0, 0.1);
        border: 2px solid #ffd700;
        color: #ffd700;
        padding: 10px;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        cursor: pointer;
        box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        transition: transform 0.2s ease, background-color 0.2s ease;
        user-select: none;
        z-index: 100;
        -webkit-tap-highlight-color: transparent;
      }

      .ui-btn:active {
        transform: scale(0.92);
        background: rgba(255, 215, 0, 0.3);
      }

      .ui-btn-icon {
        font-size: 20px;
        line-height: 1;
      }

      .ui-btn-text {
        font-size: 9px;
        font-weight: bold;
        letter-spacing: 0.5px;
        line-height: 1;
      }

      /* 音效切換按鈕定位 (配合安全區動態調整) */
      .audio-btn-global {
        top: max(10px, env(safe-area-inset-top));
        right: max(20px, env(safe-area-inset-right));
      }

      /* 左上角玩家資訊列 (配合安全區動態調整) */
      #user-info-bar {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        left: max(20px, env(safe-area-inset-left));
        display: flex;
        align-items: center;
        gap: 15px;
        background: rgba(8, 11, 16, 0.5);
        backdrop-filter: blur(4px);
        border: 2px solid #ffd700;
        padding: 8px 16px;
        border-radius: 30px;
        color: #ffd700;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        z-index: 100;
      }

      #user-info-bar button {
        background: #ffd700;
        color: #080b10;
        border: none;
        padding: 4px 10px;
        border-radius: 15px;
        cursor: pointer;
        font-weight: bold;
      }

      #user-info-bar button:active {
        transform: scale(0.95);
      }

      /* 彈窗背景與互動面板 (同樣填滿安全區) */
      #login-modal, #message-modal {
        position: fixed;
        top: -100px;
        left: -100px;
        right: -100px;
        bottom: -100px;
        width: auto;
        height: auto;

        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
      }

      #login-modal {
        background-image: url('image_7.png');
      }

      #message-modal {
        background-image: url('image_7.png');
        display: none;
      }

      #login-modal.force-rotated,
      #message-modal.force-rotated {
        width: 100dvh !important;
        height: 100vw !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) rotate(90deg) !important;
        transform-origin: center center;
      }

      /* 彈窗內容區塊樣式 */
      .login-box,
      .message-box {
        background: rgba(8, 11, 16, 0.65);
        backdrop-filter: blur(6px);
        border: 2px solid #ffd700;
        padding: 30px;
        border-radius: 16px;
        width: 90%;
        max-width: 380px;
        text-align: center;
        color: #ffd700;
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
      }

      .login-box h2,
      .message-box h2 {
        margin-bottom: 20px;
        font-size: 22px;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      }

      .message-box p {
        font-size: 16px;
        margin-bottom: 25px;
        line-height: 1.5;
        color: #fff6d1;
        text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
      }

      .login-box input[type="text"] {
        width: 100%;
        padding: 12px;
        background: rgba(8, 11, 16, 0.8);
        border: 1px solid #ffd700;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        margin-bottom: 15px;
        text-align: center;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
        touch-action: auto;
      }

      .login-box .checkbox-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        cursor: pointer;
      }

      .login-box button.submit-btn,
      .message-box button.submit-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #ffd700, #ff8c00);
        border: none;
        border-radius: 8px;
        color: #080b10;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      }

      .login-box button.submit-btn:active,
      .message-box button.submit-btn:active {
        transform: scale(0.98);
      }

      #login-error {
        color: #ff4d4d;
        font-size: 13px;
        margin-top: 10px;
        min-height: 18px;
      }

      /* 載入中動畫效果 */
      .loading-dots::after {
        content: '';
        animation: loadingDots 1.5s infinite steps(4, end);
        display: inline-block;
        width: 1em;
        text-align: left;
      }

      @keyframes loadingDots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
        100% { content: ''; }
      }

      /* 直向強制提示畫面設定 */
      #portrait-notice {
        display: none;
        position: fixed;
        top: -100px;
        left: -100px;
        right: -100px;
        bottom: -100px;
        width: auto;
        height: auto;
        background: rgba(8, 11, 16, 0.95);
        z-index: 10005;
        color: #ffd700;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        font-size: 18px;
      }

      .phone-icon {
        font-size: 48px;
        margin-bottom: 15px;
        animation: rotatePhone 2s infinite ease-in-out;
      }

      @keyframes rotatePhone {
        0%, 10% { transform: rotate(0deg); }
        40%, 60% { transform: rotate(-90deg); }
        90%, 100% { transform: rotate(0deg); }
      }

      .rotate-btn {
        top: 20px;
        right: 20px;
        width: 70px;
        height: 70px;
      }

      @media screen and (orientation: portrait) {
        #portrait-notice.active {
          display: flex;
        }
      }
    </style>
  </head>

  <body>

    <!-- ========================================== -->
    <!-- HTML 介面結構區段                         -->
    <!-- ========================================== -->

    <!-- 會員登入面板 -->
    <div id="login-modal">
      <!-- 登入畫面的音效切換按鈕 -->
      <div class="ui-btn audio-btn-global login-audio-btn">
        <span class="ui-btn-icon audio-icon-el">🔊</span>
        <span class="ui-btn-text audio-text-el">音樂開</span>
      </div>

      <div class="login-box">
        <h2>金正旺 VIP 登入</h2>
        <input type="text" id="login-input" placeholder="請輸入編號姓名 (ex: 0808包你發)">
        <label class="checkbox-container">
          <input type="checkbox" id="remember-me"> 記住我
        </label>
        <button class="submit-btn" id="login-submit-btn">確定登入</button>
        <div id="login-error"></div>
      </div>
    </div>

    <!-- 通用 UI 提示彈窗面板 -->
    <div id="message-modal">
      <div class="message-box">
        <h2 id="msg-title">提示訊息</h2>
        <p id="msg-content">這裡是提示內容...</p>
        <button class="submit-btn" id="msg-confirm-btn">確定</button>
      </div>
    </div>

    <!-- 橫向提示面板 (已移除音效按鈕避免重疊) -->
    <div id="portrait-notice">
      <div class="ui-btn rotate-btn" id="manual-rotate-btn">
        <span class="ui-btn-icon">🔄</span>
        <span class="ui-btn-text">手動旋轉</span>
      </div>
      <div class="phone-icon">📱</div>
      <p>請將手機旋轉至「橫向」<br>獲得最佳 VIP 抽卡體驗</p>
    </div>

    <!-- 遊戲主區域 -->
    <div id="game-container">

      <!-- 左上角玩家資訊列 -->
      <div id="user-info-bar">
        <span id="display-user-info">載入中...</span>
        <span id="display-user-chances">遊戲次數: -</span>
        <button id="logout-btn">登出</button>
      </div>

      <!-- 遊戲主畫面的音效切換按鈕 -->
      <div class="ui-btn audio-btn-global game-audio-btn">
        <span class="ui-btn-icon audio-icon-el">🔊</span>
        <span class="ui-btn-text audio-text-el">音樂開</span>
      </div>

      <!-- 抽卡區域 (固定 3 張卡片) -->
      <div id="card-area">
        <div class="card-container" data-index="0">
          <div class="card-shaker">
            <div class="card">
              <div class="card-face card-back"></div>
              <div class="card-face card-front">
                <div class="card-amount">--</div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-container" data-index="1">
          <div class="card-shaker">
            <div class="card">
              <div class="card-face card-back"></div>
              <div class="card-face card-front">
                <div class="card-amount">--</div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-container" data-index="2">
          <div class="card-shaker">
            <div class="card">
              <div class="card-face card-back"></div>
              <div class="card-face card-front">
                <div class="card-amount">--</div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- ========================================== -->
    <!-- JavaScript 邏輯與 Firebase 整合區段         -->
    <!-- ========================================== -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
      import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
      
      // Firebase 設定初始化
      const firebaseConfig = {
        apiKey: "AIzaSyAgXlbP-D-k_Dj13Mmop-LRIm15FTkrGGY",
        authDomain: "j808vip.firebaseapp.com",
        projectId: "j808vip",
        storageBucket: "j808vip.firebasestorage.app",
        messagingSenderId: "694827667740",
        appId: "1:694827667740:web:6767bf834427fad56eaad9",
        measurementId: "G-10J5DBGW8B"
      };
      
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const db = getFirestore(app);
      
      // DOM 元素快取綁定
      const loginModal = document.getElementById('login-modal');
      const loginInput = document.getElementById('login-input');
      const rememberMeCheckbox = document.getElementById('remember-me');
      const loginSubmitBtn = document.getElementById('login-submit-btn');
      const loginError = document.getElementById('login-error');
      
      const messageModal = document.getElementById('message-modal');
      const msgTitle = document.getElementById('msg-title');
      const msgContent = document.getElementById('msg-content');
      const msgConfirmBtn = document.getElementById('msg-confirm-btn');
      const userInfoSpan = document.getElementById('display-user-info');
      const userChancesSpan = document.getElementById('display-user-chances');
      const logoutBtn = document.getElementById('logout-btn');
      const cardContainers = document.querySelectorAll('.card-container');
      
      // 全局狀態變數
      let unsubscribeFirestore = null;
      let currentUserId = null;
      let currentUserData = null;
      const animatingCards = new Set();
      
      const cardStates = [
        { isFlipped: false, prize: null },
        { isFlipped: false, prize: null },
        { isFlipped: false, prize: null }
      ];

      // 自定義彈窗訊息顯示函數
      function showCustomAlert(title, message) {
        msgTitle.textContent = title;
        msgContent.innerHTML = message.replace(/\n/g, '<br>');
        messageModal.style.display = 'flex';
        const gameContainer = document.getElementById('game-container');
        if (gameContainer.classList.contains('force-rotated')) {
          messageModal.classList.add('force-rotated');
        } else {
          messageModal.classList.remove('force-rotated');
        }
      }
      
      msgConfirmBtn.addEventListener('click', () => {
        messageModal.style.display = 'none';
      });
      
      // 網頁載入時初始化記住我資料與登入狀態
      window.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('vip_current_user');
        const savedRemember = localStorage.getItem('vip_remember_me') === 'true';
        rememberMeCheckbox.checked = savedRemember;
        if (savedRemember && savedUser) {
          loginInput.value = savedUser;
        } else {
          loginInput.value = '';
        }
        checkAndShowLogin();
      });

      function checkAndShowLogin() {
        if (currentUserId) {
          loginModal.style.display = 'none';
          return;
        }
        loginModal.style.display = 'flex';
      }

      // 登入按鈕事件 (含伺服器預熱與 Firebase 身分驗證)
      loginSubmitBtn.addEventListener('click', async () => {
        const val = loginInput.value.trim();
        if (!val) {
          loginError.textContent = "請輸入編號姓名！";
          return;
        }
        
        loginError.innerHTML = '登入中<span class="loading-dots"></span>';
        loginSubmitBtn.disabled = true;

        try {
          await new Promise(resolve => setTimeout(resolve, 3888));

          const userDocRef = doc(db, "users", val);
          const userDocSnap = await getDoc(userDocRef);
          if (!userDocSnap.exists()) {
            loginError.textContent = "查無此 VIP 資料，請確認輸入是否正確！";
            loginSubmitBtn.disabled = false;
            return;
          }
          loginError.textContent = "";
          loginSubmitBtn.disabled = false;
          if (rememberMeCheckbox.checked) {
            localStorage.setItem('vip_current_user', val);
            localStorage.setItem('vip_remember_me', 'true');
          } else {
            localStorage.removeItem('vip_current_user');
            localStorage.setItem('vip_remember_me', 'false');
          }
          startSession(val);
        } catch (error) {
          console.error("登入驗證錯誤：", error);
          loginError.textContent = "連線異常，請稍後再試！";
          loginSubmitBtn.disabled = false;
        }
      });

      // 登出按鈕事件處理
      logoutBtn.addEventListener('click', () => {
        if (unsubscribeFirestore) unsubscribeFirestore();
        currentUserId = null;
        currentUserData = null;
        resetAllCards();
        loginModal.style.display = 'flex';
        if (!rememberMeCheckbox.checked) {
          loginInput.value = '';
          localStorage.removeItem('vip_current_user');
        }
        userInfoSpan.textContent = '載入中...';
        userChancesSpan.textContent = '遊戲次數: -';
      });

      // 重置所有卡片狀態
      function resetAllCards() {
        cardStates.forEach((state, i) => {
          state.isFlipped = false;
          state.prize = null;
          const cardEl = cardContainers[i].querySelector('.card');
          cardEl.classList.remove('flipped');
          cardContainers[i].querySelector('.card-amount').textContent = '--';
        });
      }

      // 啟動使用者會話並即時監聽 Firestore 變更
      function startSession(userId) {
        currentUserId = userId;
        loginModal.style.display = 'none';
        userInfoSpan.textContent = `VIP: ${userId}`;
        userChancesSpan.textContent = `遊戲次數: 讀取中...`;

        if (unsubscribeFirestore) unsubscribeFirestore();
        unsubscribeFirestore = onSnapshot(doc(db, "users", userId), (docSnap) => {
          if (docSnap.exists()) {
            currentUserData = docSnap.data();
            const chances = currentUserData.chances !== undefined ? currentUserData.chances : 0;
            userChancesSpan.textContent = `遊戲次數: ${chances}`;
          } else {
            userChancesSpan.textContent = `遊戲次數: 查無此人`;
          }
        }, (error) => {
          console.error("Firestore 監聽錯誤：", error);
          userChancesSpan.textContent = `遊戲次數: 連線異常`;
        });

        checkOrientationAfterLogin();
      }

      // 卡片點擊與抽獎互動邏輯
      cardContainers.forEach((container, index) => {
        const card = container.querySelector('.card');
        const shaker = container.querySelector('.card-shaker');
        const amountEl = container.querySelector('.card-amount');

        container.addEventListener('click', async () => {
          if (!currentUserId || !currentUserData) {
            showCustomAlert('系統提示', '請先登入會員！');
            return;
          }
          if (animatingCards.has(card)) return;

          const currentState = cardStates[index];
          if (currentState.isFlipped) {
            animatingCards.add(card);
            if (typeof playSFX === 'function' && window.sounds) {
              playSFX(window.sounds.flip);
            }
            card.classList.remove('flipped');
            currentState.isFlipped = false;
            currentState.prize = null;
            setTimeout(() => {
              animatingCards.delete(card);
            }, 800);
            return;
          }

          const currentChances = currentUserData.chances !== undefined ? currentUserData.chances : 0;
          if (currentChances <= 0) {
            showCustomAlert('次數不足', '目前剩餘可抽次數不足，\n請聯繫客服加值次數！');
            return;
          }

          animatingCards.add(card);

          if (typeof playSFX === 'function' && window.sounds) {
            playSFX(window.sounds.shake);
            setTimeout(() => {
              playSFX(window.sounds.win);
            }, 200);
          }
          
          shaker.classList.add('shaking');

          const apiPromise = fetch('/api/drawCard', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: currentUserId }),
          }).then(res => res.json());

          try {
            const data = await apiPromise;
            
            shaker.classList.remove('shaking');

            if (!data.success) {
              throw new Error(data.error || '抽獎失敗');
            }

            currentState.prize = data.prize;
            amountEl.textContent = currentState.prize > 0 ? `$${currentState.prize}` : '銘謝惠顧';

            if (typeof playSFX === 'function' && window.sounds) {
              playSFX(window.sounds.flip);
            }
            card.classList.add('flipped');
            currentState.isFlipped = true;

            setTimeout(() => {
              animatingCards.delete(card);
            }, 800);

          } catch (err) {
            console.error("抽獎請求失敗：", err);
            shaker.classList.remove('shaking');
            card.classList.remove('flipped');
            animatingCards.delete(card);
            showCustomAlert('系統提示', err.message || '連線異常，請稍後再試！');
          }
        });
      });

      function checkOrientationAfterLogin() {
        const isLandscape = window.matchMedia('(orientation: landscape)').matches;
        const noticeEl = document.getElementById('portrait-notice');
        const gameContainer = document.getElementById('game-container');
        if (!isLandscape && !gameContainer.classList.contains('force-rotated')) {
          noticeEl.classList.add('active');
        }
      }

      window.checkAndShowLogin = checkAndShowLogin;
      window.getCurrentUserId = () => currentUserId;
    </script>

    <!-- ========================================== -->
    <!-- 音效與畫面方向控制區段                     -->
    <!-- ========================================== -->
    <script>
      // 🎯 關鍵修復：每次畫面大小改變或旋轉時，強制重置縮放與捲動位置，防止自動旋轉後解鎖放大
      window.addEventListener('resize', () => {
        window.scrollTo(0, 0);
        const viewportMeta = document.querySelector('meta[name="viewport"]');
        if (viewportMeta) {
          viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover');
        }
      });

      window.addEventListener('pageshow', (event) => {
        const viewportMeta = document.querySelector('meta[name="viewport"]');
        if (viewportMeta) {
          viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover');
        }
        window.scrollTo(0, 0);
      });

      // 頁面載入時自動靜默發送一次 warmup 請求，整個頁面生命週期只發送一次
      let hasWarmedUp = false;

      function triggerWarmupOnce() {
        if (hasWarmedUp) return;
        hasWarmedUp = true;

        fetch('/api/warmup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        }).catch(() => {});

        document.removeEventListener('click', triggerWarmupOnce);
        document.removeEventListener('touchstart', triggerWarmupOnce);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', triggerWarmupOnce, { once: true });
      } else {
        triggerWarmupOnce();
      }

      document.addEventListener('click', triggerWarmupOnce, { passive: true });
      document.addEventListener('touchstart', triggerWarmupOnce, { passive: true });

      // 🎯 徹底禁用右鍵選單與所有手勢縮放/雙指縮放
      document.addEventListener('contextmenu', (e) => { e.preventDefault(); });
      document.addEventListener('gesturestart', (e) => { e.preventDefault(); });
      document.addEventListener('gesturechange', (e) => { e.preventDefault(); });
      document.addEventListener('gestureend', (e) => { e.preventDefault(); });

      // 圖片預載機制 (Preload Images)
      const preloadImages = ['image_6.png', 'image_7.png', 'Card_Back.JPG', 'Card_Front.JPG'];
      preloadImages.forEach(src => {
        const img = new Image();
        img.src = src;
      });

      // 音效物件初始化與音量配置 (預載入記憶體)
      const sounds = {
        bgm: new Audio('bgm01.mp3'),
        shake: new Audio('shake01.mp3'),
        flip: new Audio('flip01.mp3'),
        win: new Audio('win01.mp3')
      };
      window.sounds = sounds;
      sounds.bgm.loop = true;
      sounds.bgm.volume = 0.4;
      sounds.shake.volume = 0.6;
      sounds.flip.volume = 0.7;
      sounds.win.volume = 0.8;

      // 確保所有音效在背景預先加載（Preload）
      Object.values(sounds).forEach(audio => {
        audio.preload = 'auto';
        audio.load();
      });

      let isMuted = false;
      let bgmStarted = false;

      // 播放音效輔助函數 (搭配播完立刻銷毀，防止記憶體洩漏與卡頓)
      function playSFX(audioObj) {
        if (isMuted) return;
        const cloneAudio = audioObj.cloneNode();
        cloneAudio.volume = audioObj.volume;
        cloneAudio.play().catch(() => {});
        
        // 播放完畢後立刻清空來源與釋放實體，避免長時間累積造成卡頓
        cloneAudio.onended = () => {
          cloneAudio.src = '';
          cloneAudio.load();
        };
      }
      window.playSFX = playSFX;
      
      window.addEventListener('load', () => {
        if (isMuted) return;
        sounds.bgm.play().then(() => {
          bgmStarted = true;
        }).catch(() => {});
      });

      // 透過首次點擊觸發背景音樂播放 (應對瀏覽器自動播放限制)
      function startBGM(event) {
        if (event && event.target && event.target.closest('.audio-btn-global')) return;
        if (bgmStarted || isMuted) return;
        sounds.bgm.play().then(() => {
          bgmStarted = true;
        }).catch(() => {});
      }
      document.addEventListener('click', startBGM, { passive: true });
      document.addEventListener('touchstart', startBGM, { passive: true });
      
      // 同步更新所有音效按鈕的圖示與文字狀態
      const audioButtons = document.querySelectorAll('.audio-btn-global');
      
      audioButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          isMuted = !isMuted;
          
          audioButtons.forEach(b => {
            const iconEl = b.querySelector('.audio-icon-el');
            const textEl = b.querySelector('.audio-text-el');
            if (isMuted) {
              iconEl.textContent = '🔇';
              textEl.textContent = '靜音';
            } else {
              iconEl.textContent = '🔊';
              textEl.textContent = '音樂開';
            }
          });

          if (isMuted) {
            sounds.bgm.pause();
          } else {
            sounds.bgm.play().then(() => { bgmStarted = true; }).catch(() => {});
          }
        });
      });

      // 頁面隱藏或離開時自動停止所有音效
      function stopAllAudio() {
        Object.values(sounds).forEach(audio => audio.pause());
      }
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          sounds.bgm.pause();
        } else {
          if (!isMuted) sounds.bgm.play().catch(() => {});
        }
      });
      window.addEventListener('pagehide', stopAllAudio);
      window.addEventListener('beforeunload', stopAllAudio);
      
      // 螢幕旋轉與版面適應控制
      const noticeEl = document.getElementById('portrait-notice');
      const gameContainer = document.getElementById('game-container');
      const rotateBtn = document.getElementById('manual-rotate-btn');
      const loginModal = document.getElementById('login-modal');
      const messageModal = document.getElementById('message-modal');
      
      rotateBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        noticeEl.classList.remove('active');
        gameContainer.classList.add('force-rotated');
        loginModal.classList.add('force-rotated');
        messageModal.classList.add('force-rotated');
        if (window.checkAndShowLogin) {
          window.checkAndShowLogin();
        }
        window.dispatchEvent(new Event('resize'));
      });

      function checkOrientation() {
        const isLandscape = window.matchMedia('(orientation: landscape)').matches;
        if (isLandscape) {
          gameContainer.classList.remove('force-rotated');
          loginModal.classList.remove('force-rotated');
          messageModal.classList.remove('force-rotated');
          noticeEl.classList.remove('active');
          if (window.checkAndShowLogin) {
            window.checkAndShowLogin();
          }
        } else {
          if (window.getCurrentUserId && window.getCurrentUserId() && !gameContainer.classList.contains('force-rotated')) {
            noticeEl.classList.add('active');
          }
        }
      }
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', checkOrientation);
    </script>
  </body>
</html>
