<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>Safe Area 測試</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 設定跟圖片相近的底色，萬一比例不合露出空隙時不會太突兀 */
      background: #080b10;
    }

    #test {
      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;
      width: 100vw;
      height: 100dvh;

      background-image: url('image_6.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      /*
        讓內容延伸到 Safe Area
      */
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);

      overflow: hidden;
    }

    .text {
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="test">
    <div class="text">
      背景 image_6.jpg 測試<br>
      請橫向觀看
    </div>
  </div>

</body>
</html>
