<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Safe Area 測試</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b10;
    }

    #test {
      position: fixed;
      /* 完美強制填滿整個手機實體可視範圍，避開瀏覽器網址列干擾 */
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;

      background-image: url('image_6.jpg');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .text {
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="test">
    <div class="text">
      100dvh 強制滿版測試<br>
      請橫向觀看
    </div>
  </div>

</body>
</html>
