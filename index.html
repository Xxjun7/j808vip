<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金正旺銀行vip抽卡系統</title>
    <style>
        /* ==========================================
           1. 全局基礎樣式設定 (Global Styles)
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial Black', Impact, sans-serif;
            background-color: #080b10;
        }

        /* ==========================================
           2. 遊戲主畫面容器 (Game Main Container)
           ========================================== */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('image_6.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ==========================================
           3. 卡片展示區域 (Card Layout Area)
           ========================================== */
        #card-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 2vw, 30px);
            width: 100%;
            max-width: 1000px;
        }

        /* 卡片外層容器：負責 3D 透視與響應式尺寸 */
        .card-container {
            width: clamp(90px, 25vw, 240px);
            aspect-ratio: 2.5 / 3.5;
            perspective: 1200px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ==========================================
           4. 卡片主體與 3D 翻牌動畫 (Card Body & Flip Animation)
           ========================================== */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            border-radius: clamp(8px, 1.5vw, 16px);
        }

        /* 滑鼠懸停於未翻開卡片時的浮起效果 */
        .card-container:hover .card:not(.flipped) {
            transform: translateY(-12px) rotateX(6deg) scale(1.03);
        }

        /* 卡片翻轉到正面的狀態 */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* 滑鼠懸停於已翻開卡片時的浮起效果 */
        .card-container:hover .card.flipped {
            transform: rotateY(180deg) translateY(-12px) scale(1.03);
        }

        /* ==========================================
           5. 新增：翻牌前的「搖晃蓄力」動畫效果
           ========================================== */
        .card.shaking {
            animation: cardShake 0.5s ease-in-out;
        }

        @keyframes cardShake {
            0% { transform: scale(1) rotate(0deg); }
            15% { transform: scale(1.05) rotate(-4deg) translateY(-5px); }
            30% { transform: scale(1.05) rotate(4deg) translateY(-5px); }
            45% { transform: scale(1.08) rotate(-4deg) translateY(-8px); }
            60% { transform: scale(1.08) rotate(4deg) translateY(-8px); }
            75% { transform: scale(1.1) rotate(-2deg) translateY(-10px); }
            90% { transform: scale(1.1) rotate(2deg) translateY(-10px); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* ==========================================
           6. 卡片雙面樣式 (Card Front & Back)
           ========================================== */
        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: clamp(8px, 1.5vw, 16px);
            overflow: hidden;
            background-size: 100% 100%;
            background-position: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 229, 255, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* 卡片背面圖片 */
        .card-back {
            background-image: url('Card_Back.png');
        }

        /* 卡片正面圖片與旋轉設定 */
        .card-front {
            background-image: url('Card_Front.png');
            transform: rotateY(180deg);
            position: relative;
        }

        /* 金額文字定位與光芒特效 */
        .card-amount {
            position: absolute;
            top: 27.5%; 
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            text-align: center;
            font-size: clamp(14px, 2.5vw, 24px);
            font-weight: 900;
            color: #fff6d1;
            text-shadow: 0 0 5px #ffd700, 0 0 10px #ff8c00, 0 0 20px #ff0000;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* ==========================================
           7. 新增：強制直向裝置旋轉提示 (Landscape Notice)
           ========================================== */
        #portrait-notice {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 11, 16, 0.95);
            z-index: 9999;
            color: #ffd700;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }

        .phone-icon {
            font-size: 48px;
            margin-bottom: 15px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0%, 10% { transform: rotate(0deg); }
            40%, 60% { transform: rotate(-90deg); }
            90%, 100% { transform: rotate(0deg); }
        }

        /* 當螢幕為直向 (Portrait) 時顯示提示覆蓋層 */
        @media screen and (orientation: portrait) {
            #portrait-notice {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- 直向提示面板 (手機豎拿時會自動跳出提示) -->
    <div id="portrait-notice">
        <div class="phone-icon">📱</div>
        <p>請將手機旋轉至「橫向」<br>獲得最佳 VIP 抽卡體驗</p>
    </div>

    <!-- 遊戲主區域 -->
    <div id="game-container">
        <div id="card-area">
            <!-- 卡片 1 -->
            <div class="card-container">
                <div class="card">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <div class="card-amount">$10,000</div>
                    </div>
                </div>
            </div>

            <!-- 卡片 2 -->
            <div class="card-container">
                <div class="card">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <div class="card-amount">$50,000</div>
                    </div>
                </div>
            </div>

            <!-- 卡片 3 -->
            <div class="card-container">
                <div class="card">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <div class="card-amount">$100,000</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 8. 隨機金額資料庫 (Reward Pool)
        // ==========================================
        const rewards = ['$1,000', '$5,000', '$20,000', '$50,000', '$100,000', '$1,000,000'];

        // 防重複點擊標記 (避免動畫撥放期間多次觸發)
        let isAnimating = false;

        // ==========================================
        // 9. 自動請求橫向全螢幕 (Auto Landscape Request)
        // ==========================================
        window.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(() => {
                            // 部分瀏覽器/iOS不支援 API 鎖定，會自動退回 CSS 提示層
                        });
                    }
                }).catch(() => {});
            }
        }, { once: true });

        // ==========================================
        // 10. 卡片點擊事件與蓄力動畫邏輯 (Card Click & Shake Logic)
        // ==========================================
        document.querySelectorAll('.card-container').forEach(container => {
            const card = container.querySelector('.card');
            const amountEl = container.querySelector('.card-amount');

            container.addEventListener('click', () => {
                if (isAnimating) return;

                // 【狀況 A】：翻開卡片（背面 -> 正面）
                if (!card.classList.contains('flipped')) {
                    isAnimating = true;

                    // 1. 先加上搖晃 class 進行 0.5 秒蓄力
                    card.classList.add('shaking');

                    // 2. 蓄力期間抽取隨機金額
                    const randomReward = rewards[Math.floor(Math.random() * rewards.length)];
                    amountEl.textContent = randomReward;

                    // 3. 0.5 秒搖晃完畢後開始執行翻牌
                    setTimeout(() => {
                        card.classList.remove('shaking');
                        card.classList.add('flipped');
                        
                        // 等待翻牌動畫結束 (0.8s) 後解除動畫鎖
                        setTimeout(() => {
                            isAnimating = false;
                        }, 800);
                    }, 500);

                } 
                // 【狀況 B】：蓋回卡片（正面 -> 背面）
                else {
                    // 不觸發搖晃，直接翻回背面
                    card.classList.remove('flipped');
                }
            });
        });
    </script>

</body>
</html>
