<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金正旺銀行vip抽卡系統</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial Black', Impact, sans-serif;
            background-color: #080b10;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('image_2.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #card-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 2vw, 30px);
            width: 100%;
            max-width: 1000px;
        }

        .card-container {
            width: clamp(90px, 25vw, 240px);
            aspect-ratio: 2.5 / 3.5;
            perspective: 1200px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            border-radius: clamp(8px, 1.5vw, 16px);
        }

        .card-container:hover .card:not(.flipped) {
            transform: translateY(-12px) rotateX(6deg) scale(1.03);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-container:hover .card.flipped {
            transform: rotateY(180deg) translateY(-12px) scale(1.03);
        }

        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: clamp(8px, 1.5vw, 16px);
            overflow: hidden;
            background-size: 100% 100%;
            background-position: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 229, 255, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* 卡片背面 */
        .card-back {
            background-image: url('Card_Back.png');
        }

        /* 卡片正面 */
        .card-front {
            background-image: url('Card_Front.png');
            transform: rotateY(180deg);
            position: relative;
        }

        /* 關鍵：定位在金色 AMOUNT 框框內的數字 */
        .card-amount {
            position: absolute;
            /* 依據圖片中金色外框的位置微調 percentage */
            top: 27.5%; 
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            text-align: center;

            /* 金光/霓虹文字特效 */
            font-size: clamp(14px, 2.5vw, 24px);
            font-weight: 900;
            color: #fff6d1;
            text-shadow: 0 0 5px #ffd700, 0 0 10px #ff8c00, 0 0 20px #ff0000;
            letter-spacing: 1px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="card-area">
            <!-- 卡片 1 -->
            <div class="card-container">
                <div class="card">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <div class="card-amount">$10,000</div>
                    </div>
                </div>
            </div>

            <!-- 卡片 2 -->
            <div class="card-container">
                <div class="card">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <div class="card-amount">$50,000</div>
                    </div>
                </div>
            </div>

            <!-- 卡片 3 -->
            <div class="card-container">
                <div class="card">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <div class="card-amount">$100,000</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 隨機金額庫範例
        const rewards = ['$1,000', '$5,000', '$20,000', '$50,000', '$100,000', '$1,000,000'];

        document.querySelectorAll('.card-container').forEach(container => {
            const card = container.querySelector('.card');
            const amountEl = container.querySelector('.card-amount');

            container.addEventListener('click', () => {
                // 如果還沒翻開，翻牌時可以動態抽取隨機金額
                if (!card.classList.contains('flipped')) {
                    const randomReward = rewards[Math.floor(Math.random() * rewards.length)];
                    amountEl.textContent = randomReward;
                }
                card.classList.toggle('flipped');
            });
        });
    </script>

</body>
</html>
