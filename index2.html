<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>博弈娛樂 - 3D 抽卡系統</title>
    <style>
        /* 全局與重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080b10;
        }

        /* 主容器：支援手機與電腦居中不超出 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('image_0.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 橫向三張卡片區域 (RWD 自適應與防溢出) */
        #card-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 2vw, 30px);
            width: 100%;
            max-width: 1000px;
        }

        /* 3D 透視容器：動態計算寬高比 (2.5:3.5 撲克牌比例) */
        .card-container {
            width: clamp(90px, 25vw, 240px);
            aspect-ratio: 2.5 / 3.5;
            perspective: 1200px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 卡片主體：保留 3D 空間感與貝茲曲線動畫 */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            border-radius: clamp(8px, 1.5vw, 16px);
        }

        /* Hover 立體浮動與微閃光特效 (僅非 Touch 裝置或未翻牌時效果佳) */
        .card-container:hover .card:not(.flipped) {
            transform: translateY(-12px) rotateX(6deg) scale(1.03);
        }

        /* 翻牌狀態：沿 Y 軸旋轉 180 度 */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* 翻牌後的 Hover 浮動效果 */
        .card-container:hover .card.flipped {
            transform: rotateY(180deg) translateY(-12px) scale(1.03);
        }

        /* 正反兩面共用樣式：隱藏背面穿幫 */
        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: clamp(8px, 1.5vw, 16px);
            overflow: hidden;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 
                        0 0 15px rgba(0, 229, 255, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* 卡片背面 (預設朝上) */
        .card-back {
            background-image: url('Card_Back.png');
        }

        /* 卡片正面 (預設旋轉 180 度) */
        .card-front {
            background-image: url('Card_Front.png');
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="card-area">
            <!-- 卡片 1 -->
            <div class="card-container">
                <div class="card">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front"></div>
                </div>
            </div>
            <!-- 卡片 2 -->
            <div class="card-container">
                <div class="card">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front"></div>
                </div>
            </div>
            <!-- 卡片 3 -->
            <div class="card-container">
                <div class="card">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 綁定所有卡片點擊翻牌事件
        document.querySelectorAll('.card-container').forEach(container => {
            const card = container.querySelector('.card');
            container.addEventListener('click', () => {
                card.classList.toggle('flipped');
            });
        });
    </script>

</body>
</html>
