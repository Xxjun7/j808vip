<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博弈抽卡系統 (修正版)</title>
    <style>
        /* 基本頁面樣式 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 遊戲背景層 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* 保持使用 image_0.png 作為背景 */
            background-image: url('image_0.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 卡片區域容器 (用於定位) */
        #card-area {
            display: flex;
            gap: 20px;
        }

        /* 每個卡片的容器 (包含翻轉邏輯和尺寸設定) */
        .card-container {
            /* 設置卡片尺寸 (撲克牌比例 2.5x3.5) */
            width: 250px; 
            height: 350px; 
            perspective: 1500px; /* 增加透視感，讓動畫更真實 */
            cursor: pointer;
        }

        /* 卡片主體 (包含正反面) */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d; /* 保留 3D 變換 */
            transition: transform 0.8s ease-in-out; /* 設置流暢的翻轉動畫 */
        }

        /* 卡片翻轉後的狀態 */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* 卡片正面和背面共用樣式 */
        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            -webkit-backface-visibility: hidden; /* 隱藏背面，避免翻轉時閃爍 */
            backface-visibility: hidden;
            border-radius: 12px; /* 設置圓角，匹配素材設計 */
            overflow: hidden; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.6); /* 添加更深的陰影 */
        }

        /* 修正 2：卡片背面 (預設顯示) */
        .card-back {
            /* 使用獨立生成的 Card_Back.png */
            background-image: url('Card_Back.png');
            background-size: 100% 100%; /* 精確填滿 */
            background-position: center;
        }

        /* 修正 2：卡片正面 (翻轉後顯示) */
        .card-front {
            /* 使用獨立生成的 Card_Front.png */
            background-image: url('Card_Front.png');
            background-size: 100% 100%; /* 精確填滿 */
            background-position: center;
            transform: rotateY(180deg); /* 正面預先翻轉，這樣翻轉時才會正確顯示 */
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div id="card-area">
            <!-- 這裡放置一張卡片，点击即可翻轉 -->
            <div class="card-container" id="drawCard">
                <div class="card">
                    <!-- 背面 (預設顯示) -->
                    <div class="card-face card-back"></div>
                    <!-- 正面 (翻轉後顯示) -->
                    <div class="card-face card-front"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 獲取卡片容器元素
        const cardContainer = document.getElementById('drawCard');
        const card = cardContainer.querySelector('.card');

        // 添加點擊事件
        cardContainer.addEventListener('click', () => {
            // 切換 'flipped' 類，觸發 CSS 翻轉動畫
            card.classList.toggle('flipped');
        });
    </script>

</body>
</html>
