<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金正旺銀行vip抽卡系統</title>
    <style>
        /* ==========================================
           1. 全局基礎樣式設定
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial Black', Impact, sans-serif;
            background-color: #080b10;
        }

        /* ==========================================
           2. 遊戲主畫面容器
           ========================================== */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('image_6.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
        }

        /* 💡 強制旋轉樣式：將畫面旋轉 90 度並調換長寬 */
        #game-container.force-rotated {
            width: 100vh !important;
            height: 100vw !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) rotate(90deg) !important;
            transform-origin: center center;
        }

        #game-container.force-rotated #card-area {
            gap: clamp(10px, 2vh, 30px) !important;
        }

        #game-container.force-rotated .card-container {
            width: clamp(90px, 25vh, 240px) !important;
        }

        #game-container.force-rotated .card-amount {
            font-size: clamp(14px, 2.5vh, 24px) !important;
        }

        /* 音樂控制按鈕在強制旋轉模式下的位移修正 (固定左上角) */
        #game-container.force-rotated #audio-control-btn {
            top: 20px;
            left: 20px;
        }

        /* ==========================================
           3. 卡片展示區域
           ========================================== */
        #card-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 2vw, 30px);
            width: 100%;
            max-width: 1000px;
        }

        .card-container {
            width: clamp(90px, 25vw, 240px);
            aspect-ratio: 2.5 / 3.5;
            perspective: 1200px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ==========================================
           4. 中間層：專門負責「搖晃蓄力」動畫
           ========================================== */
        .card-shaker {
            width: 100%;
            height: 100%;
            will-change: transform;
            transition: transform 0.3s ease;
        }

        .card-container:hover .card-shaker {
            transform: translateY(-10px) scale(1.03);
        }

        .card-shaker.shaking {
            animation: cardShake 0.5s ease-in-out forwards;
        }

        @keyframes cardShake {
            0% { transform: scale(1) rotate(0deg); }
            15% { transform: scale(1.05) rotate(-5deg) translateY(-5px); }
            30% { transform: scale(1.05) rotate(5deg) translateY(-5px); }
            45% { transform: scale(1.08) rotate(-5deg) translateY(-8px); }
            60% { transform: scale(1.08) rotate(5deg) translateY(-8px); }
            75% { transform: scale(1.1) rotate(-3deg) translateY(-10px); }
            90% { transform: scale(1.1) rotate(3deg) translateY(-10px); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* ==========================================
           5. 核心 3D 翻牌層
           ========================================== */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: clamp(8px, 1.5vw, 16px);
            will-change: transform;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        /* ==========================================
           6. 卡片正反面與文字樣式
           ========================================== */
        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: clamp(8px, 1.5vw, 16px);
            overflow: hidden;
            background-size: 100% 100%;
            background-position: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 229, 255, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.3);
            transform: translateZ(1px);
        }

        .card-back {
            background-image: url('Card_Back.png');
        }

        .card-front {
            background-image: url('Card_Front.png');
            transform: rotateY(180deg) translateZ(1px);
            position: relative;
        }

        .card-amount {
            position: absolute;
            top: 27.5%; 
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            text-align: center;
            font-size: clamp(14px, 2.5vw, 24px);
            font-weight: 900;
            color: #fff6d1;
            text-shadow: 0 0 5px #ffd700, 0 0 10px #ff8c00, 0 0 20px #ff0000;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* ==========================================
           7. 橫向提示面板與 UI 按鈕
           ========================================== */
        #portrait-notice {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 11, 16, 0.95);
            z-index: 9999;
            color: #ffd700;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }

        .phone-icon {
            font-size: 48px;
            margin-bottom: 15px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0%, 10% { transform: rotate(0deg); }
            40%, 60% { transform: rotate(-90deg); }
            90%, 100% { transform: rotate(0deg); }
        }

        /* 旋轉按鈕 */
        .rotate-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
            transition: transform 0.2s ease, background-color 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .rotate-btn:active {
            transform: scale(0.92);
            background: rgba(255, 215, 0, 0.3);
        }

        .rotate-btn-icon {
            font-size: 22px;
            line-height: 1;
        }

        .rotate-btn-text {
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        /* 音效開關按鈕 (改至左上角) */
        .audio-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .audio-btn:active {
            transform: scale(0.92);
        }

        .audio-btn.muted {
            border-color: #888;
            color: #888;
            box-shadow: none;
        }

        .audio-btn-icon {
            font-size: 20px;
            line-height: 1;
        }

        .audio-btn-text {
            font-size: 9px;
            font-weight: bold;
            line-height: 1;
        }

        @media screen and (orientation: portrait) {
            #portrait-notice.active {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- 橫向提示面板 -->
    <div id="portrait-notice">
        <div class="rotate-btn" id="manual-rotate-btn">
            <span class="rotate-btn-icon">🔄</span>
            <span class="rotate-btn-text">手動旋轉</span>
        </div>

        <div class="phone-icon">📱</div>
        <p>請將手機旋轉至「橫向」<br>獲得最佳 VIP 抽卡體驗</p>
    </div>

    <!-- 遊戲主區域 -->
    <div id="game-container">
        <!-- 音樂開關按鈕（位於左上角） -->
        <div class="audio-btn" id="audio-control-btn">
            <span class="audio-btn-icon" id="audio-icon">🔊</span>
            <span class="audio-btn-text" id="audio-text">音效開啟</span>
        </div>

        <div id="card-area">
            <!-- 卡片 1 -->
            <div class="card-container">
                <div class="card-shaker">
                    <div class="card">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">
                            <div class="card-amount">$10,000</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 卡片 2 -->
            <div class="card-container">
                <div class="card-shaker">
                    <div class="card">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">
                            <div class="card-amount">$50,000</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 卡片 3 -->
            <div class="card-container">
                <div class="card-shaker">
                    <div class="card">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">
                            <div class="card-amount">$100,000</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 本地背景音樂檔 -->
    <audio id="bgm" src="bgm01.mp3" loop autoplay muted></audio>

    <script>
        // ==========================================
        // ⚙️ 設定區 (Config)
        // ==========================================
        const ENABLE_PORTRAIT_NOTICE = true; 
        const BGM_VOLUME = 0.1; // 背景音樂音量調整為更小聲 (0.1)

        // ==========================================
        // 音效系統 (Web Audio API)
        // ==========================================
        let isAudioMuted = false;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // 合成卡片洗牌/蓄力搖晃音效 (大幅提高音量並調整音調)
        function playSwooshSound() {
            if (isAudioMuted) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);

                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
            } catch (e) {
                console.error(e);
            }
        }

        // 合成 VIP 揭牌中獎音效 (提高音量與亮麗開獎音質)
        function playCardFlipRewardSound() {
            if (isAudioMuted) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 明亮的慶祝和弦 (C5, E5, G5, C6)
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + (index * 0.05));

                    gain.gain.setValueAtTime(0.4, now + (index * 0.05));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6 + (index * 0.05));

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + (index * 0.05));
                    osc.stop(now + 0.7 + (index * 0.05));
                });
            } catch (e) {
                console.error(e);
            }
        }

        // ==========================================
        // 系統邏輯
        // ==========================================
        const noticeEl = document.getElementById('portrait-notice');
        const gameContainer = document.getElementById('game-container');
        const rotateBtn = document.getElementById('manual-rotate-btn');
        const bgm = document.getElementById('bgm');
        const audioControlBtn = document.getElementById('audio-control-btn');
        const audioIcon = document.getElementById('audio-icon');
        const audioText = document.getElementById('audio-text');

        // 初始化背景音樂音量與自動播放解除靜音機制
        bgm.volume = BGM_VOLUME;

        function enableAudioPlayback() {
            getAudioContext();
            if (!isAudioMuted) {
                bgm.muted = false;
                if (bgm.paused) {
                    bgm.play().catch(() => {});
                }
            }
        }

        // 頁面任意點擊或滑動皆可解鎖瀏覽器限制並播放音樂與音效
        ['click', 'touchstart', 'keydown'].forEach(eventType => {
            window.addEventListener(eventType, enableAudioPlayback, { once: true });
        });

        // 音訊開關點擊邏輯
        audioControlBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isAudioMuted = !isAudioMuted;

            if (isAudioMuted) {
                bgm.pause();
                audioControlBtn.classList.add('muted');
                audioIcon.textContent = '🔇';
                audioText.textContent = '音效關閉';
            } else {
                bgm.muted = false;
                bgm.play().catch(() => {});
                audioControlBtn.classList.remove('muted');
                audioIcon.textContent = '🔊';
                audioText.textContent = '音效開啟';
            }
        });

        if (ENABLE_PORTRAIT_NOTICE) {
            noticeEl.classList.add('active');
        } else {
            noticeEl.classList.remove('active');
        }

        // 點擊「手動旋轉」按鈕
        rotateBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            enableAudioPlayback();
            noticeEl.classList.remove('active');
            gameContainer.classList.add('force-rotated');
        });

        // 偵測螢幕方向切換
        function checkOrientation() {
            const isLandscape = window.matchMedia("(orientation: landscape)").matches;

            if (isLandscape) {
                gameContainer.classList.remove('force-rotated');
                noticeEl.classList.remove('active');
            } else {
                if (!gameContainer.classList.contains('force-rotated') && ENABLE_PORTRAIT_NOTICE) {
                    noticeEl.classList.add('active');
                }
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);

        const rewards = ['$1,000', '$5,000', '$20,000', '$50,000', '$100,000', '$1,000,000'];
        const animatingCards = new Set();

        // 點擊抽卡邏輯
        document.querySelectorAll('.card-container').forEach(container => {
            const shaker = container.querySelector('.card-shaker');
            const card = container.querySelector('.card');
            const amountEl = container.querySelector('.card-amount');

            container.addEventListener('click', () => {
                enableAudioPlayback();
                if (animatingCards.has(card)) return;

                // 翻開卡片
                if (!card.classList.contains('flipped')) {
                    animatingCards.add(card);

                    const randomReward = rewards[Math.floor(Math.random() * rewards.length)];
                    amountEl.textContent = randomReward;

                    shaker.classList.add('shaking');
                    playSwooshSound(); // 播放蓄力音效

                    setTimeout(() => {
                        shaker.classList.remove('shaking');
                        card.classList.add('flipped');
                        playCardFlipRewardSound(); // 播放翻開慶祝和弦音效

                        setTimeout(() => {
                            animatingCards.delete(card);
                        }, 800);
                    }, 500);

                } 
                // 蓋回卡片
                else {
                    card.classList.remove('flipped');
                    playSwooshSound();
                }
            });
        });
    </script>

</body>
</html>
